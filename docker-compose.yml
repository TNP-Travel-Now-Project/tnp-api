services:
  api:
    build:
      context: .
      dockerfile: AuthApi.WebApi/Dockerfile
    entrypoint: >
      sh -c "dotnet AuthApi.WebApi.dll --migrate && dotnet AuthApi.WebApi.dll"
    ports:
      - "${API_PORT:-5000}:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ConnectionStrings__Default=Server=sqlserver,1433;Database=AuthDb;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True
      - ConnectionStrings__Redis=redis:6379
      - AppSettings__JwtKey=${JWT_KEY}
      - AppSettings__JwtIssuer=${JWT_ISSUER:-TravelNow}
      - AppSettings__JwtAudience=${JWT_AUDIENCE:-TravelNowApp}
      - Frontend__Url=${FRONTEND_URL:-http://localhost:3000}
    restart: unless-stopped

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${SA_PASSWORD}
    ports:
      - "${SQL_PORT:-1433}:1433"
    volumes:
      - sql_data:/var/opt/mssql
    healthcheck:
      test:
        ["CMD", "/opt/mssql-tools18/bin/sqlcmd",
         "-C", "-S", "localhost",
         "-U", "sa", "-P", "${SA_PASSWORD}",
         "-Q", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  sql_data:
  redis_data:
